<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 링크 공유 미리보기 이미지(og.png, 1200×630) 원본. 1200×630 창에서 캡처해 og.png 로 저장 -->
<title>2028 대입전형 OG 카드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;900&display=swap">
<style>
:root{--bg:#f5f6f4;--ink:#1b2127;--ink2:#46505a;--accent:#bf3036;
  --t1:#2f5da8;--t2:#2e8c7c;--t3:#d99a2b;--t4:#7a4e9a;
  --f-display:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;background:var(--bg);color:var(--ink);font-family:var(--f-display);word-break:keep-all}
/* 카카오톡 말풍선(폭 약 260px)에서도 읽히도록 글자를 크게, 작은 범례는 뺌 */
.c{height:100%;padding:58px 72px 54px;border-top:16px solid var(--accent);display:flex;flex-direction:column}
.eyebrow{font-weight:800;font-size:34px;color:var(--accent)}
h1{margin:18px 0 0;font-size:112px;font-weight:900;letter-spacing:-.035em;line-height:1.04}
p{margin:30px 0 0;font-size:44px;font-weight:700;color:var(--ink2);line-height:1.3}
p b{color:var(--ink)}
.bar{display:flex;height:30px;border-radius:15px;overflow:hidden;margin-top:auto}
.bar i{display:block}
</style>
</head>
<body>
<div class="c">
  <span class="eyebrow">2028학년도 대학입학전형 시행계획</span>
  <h1>2028 대입전형<br>시행계획 요약</h1>
  <p><b>71개 대학</b> 교과·종합·논술·정시 한눈에</p>
  <span class="bar"><i style="flex:98;background:var(--t1)"></i><i style="flex:140;background:var(--t2)"></i><i style="flex:44;background:var(--t3)"></i><i style="flex:98;background:var(--t4)"></i></span>
</div>
</body>
</html>
