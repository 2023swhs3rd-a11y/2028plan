<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 링크 공유 미리보기 이미지(og.png, 1200×630) 원본. 1200×630 창에서 캡처해 og.png 로 저장 -->
<title>2028 대입전형 OG 카드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;900&display=swap">
<style>
:root{--bg:#f5f6f4;--surface:#fff;--line:#dfe3df;--ink:#1b2127;--ink2:#46505a;--accent:#bf3036;
  --t1:#2f5da8;--t2:#2e8c7c;--t3:#d99a2b;--t4:#7a4e9a;
  --f-display:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;background:var(--bg);color:var(--ink);font-family:var(--f-display);word-break:keep-all}
.c{height:100%;padding:64px 80px 56px;border-top:14px solid var(--accent);display:flex;flex-direction:column}
.eyebrow{font-weight:700;font-size:26px;letter-spacing:.02em;color:var(--accent)}
h1{margin:22px 0 0;font-size:84px;font-weight:900;letter-spacing:-.03em;line-height:1.1}
p{margin:26px 0 0;font-size:32px;font-weight:500;color:var(--ink2);line-height:1.45}
.bar{display:flex;height:18px;border-radius:9px;overflow:hidden;margin-top:auto}
.bar i{display:block}
.leg{display:flex;gap:34px;margin-top:18px;font-size:24px;font-weight:700;color:var(--ink2)}
.leg span{display:flex;align-items:center;gap:10px}
.leg i{width:16px;height:16px;border-radius:4px;display:block}
</style>
</head>
<body>
<div class="c">
  <span class="eyebrow">2028학년도 대학입학전형 시행계획 · 정원 내</span>
  <h1>2028 대입전형<br>시행계획 요약</h1>
  <p>71개 대학 · 학생부교과 · 학생부종합 · 논술 · 정시<br>전형 방법과 2027 대비 변경사항</p>
  <span class="bar"><i style="flex:98;background:var(--t1)"></i><i style="flex:140;background:var(--t2)"></i><i style="flex:44;background:var(--t3)"></i><i style="flex:98;background:var(--t4)"></i></span>
  <div class="leg"><span><i style="background:var(--t1)"></i>학생부교과</span><span><i style="background:var(--t2)"></i>학생부종합</span><span><i style="background:var(--t3)"></i>논술</span><span><i style="background:var(--t4)"></i>정시 수능위주</span></div>
</div>
</body>
</html>
