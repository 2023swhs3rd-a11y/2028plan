# Cloudflare Workers 배포 설정: mcp 폴더에서 `npx wrangler deploy`
name = "admissions-2028-mcp"
main = "src/worker.js"
compatibility_date = "2025-10-01"

[vars]
DATA_URL = "https://2023swhs3rd-a11y.github.io/2028plan/data.json"
ACCESS_MODE = "either"
GEMINI_MODEL = "gemini-3.5-flash-lite"
CLAUDE_MODEL = "claude-sonnet-4-5"
RATE_LIMIT_PER_MIN = "10"
RATE_LIMIT_PER_DAY_IP = "100"
RATE_LIMIT_PER_DAY_TOTAL = "500"

# 비밀값은 `npx wrangler secret put <이름>` 또는 Cloudflare 대시보드에서 설정:
#   GEMINI_API_KEY     : Google AI Studio API 키 (AIza… 및 신규 AQ.… 모두 지원)
#   GEMINI_BASE_URL    : (선택) Vertex AI Express 등 커스텀 엔드포인트 사용 시 지정
#   ANTHROPIC_API_KEY  : Anthropic API 키 (복합 비교·상담 준비표·안내문 작성)
#   ALLOWED_IPS        : 학교/기관 허용 IP 또는 CIDR (쉼표·공백 구분, 예: 210.100.12.0/24)
#   ACCESS_CODE        : 외부 접속용 접근 코드(비밀번호)
#   ALLOWED_ORIGINS    : (선택) 허용 Origin 제한 (예: https://2023swhs3rd-a11y.github.io)

# 한국→홍콩(HKG) 경유 시 Gemini 지역 차단 회피용 북미(wnam) 출구 Durable Object (무료 플랜 SQLite 지원)
[[durable_objects.bindings]]
name = "GEMINI_PROXY"
class_name = "GeminiProxy"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GeminiProxy"]

# 미리보기 배포(main 이외 브랜치·PR)용. 비워 두면 위 설정을 그대로 쓴다.
